[alma_0_tool]
# Configuration for the Alma-0 Declarative Programming Tool

language_version = "Alma-0"
execution_mode = "strict_specification"
log_level = "INFO"
output_format = "console"
max_iterations = 1000
enable_formal_verification = true
specification_enforcement = "enabled"

[paths]
main_entry = "main.alma"
modules_dir = "modules"
output_dir = "output"

[options]
debug_mode = false
optimize_refinement = true
