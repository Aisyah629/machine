# COMAL Algorithmic Processor Configuration
# Runtime settings and default parameters

[system]
log_level=INFO
max_memory_mb=256
parallel_threads=1

[paths]
input_dir=./data/input
output_dir=./data/output
log_dir=./logs

[processing]
batch_size=1000
skip_header=true
encoding=ASCII

[validation]
strict_mode=false
fail_on_warning=false
