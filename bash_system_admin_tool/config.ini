[monitoring]
cpu_threshold=85
memory_threshold=90
disk_threshold=80
check_interval=300

[logging]
log_dir=${SCRIPT_DIR}/logs
log_max_size=100M
log_retention_days=30

[alerts]
enabled=true
email_recipient=admin@example.com
slack_webhook=https://hooks.slack.com/services/PLACEHOLDER

[services]
check_nginx=true
check_mysql=true
check_redis=true
