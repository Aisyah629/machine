# Lucid Tool Configuration
# This file contains runtime configuration for the Lucid execution environment

# Enable debug mode for verbose output
DEBUG_MODE=false

# Maximum number of threads for parallel execution
MAX_THREADS=4

# Cache size in megabytes
CACHE_SIZE_MB=512

# Optimization level (0-3, 0=no optimization, 3=max optimization)
OPTIMIZATION_LEVEL=2

# Target architecture (e.g., x86_64, aarch64)
TARGET_ARCHITECTURE=x86_64

# Paths to search for modules
MODULE_PATHS=./modules;/usr/local/lib/lucid/modules

# Log level (DEBUG, INFO, WARN, ERROR)
LOG_LEVEL=INFO

# Enable sandboxed execution for untrusted code
SANDBOX_ENABLED=false

# Maximum execution time per process in seconds
MAX_EXECUTION_TIME=30

# Memory limit per process in megabytes
MEMORY_LIMIT_MB=256
